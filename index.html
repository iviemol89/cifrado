<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYX Crypt</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f0f12; --panel: #1a1a20; --gold: #d4af37; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 10px; }
        .card { background: var(--panel); padding: 20px; border-radius: 16px; width: 100%; max-width: 500px; border: 1px solid #333; }
        h2 { text-align: center; color: var(--gold); margin: 0 0 5px 0; }
        textarea, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; background: #2d2d3a; color: white; border: 1px solid #444; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-gold { background: var(--gold); color: black; }
        .btn-cifrar { background: #8b0000; color: white; }
        .btn-descifrar { background: #006400; color: white; }
        #output { background: #000; padding: 10px; margin-top: 10px; border-radius: 8px; word-break: break-all; min-height: 20px; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; background: white; padding: 10px; border-radius: 8px; }
        #reader { width: 100%; max-width: 320px; margin: 15px auto 0 auto; display: none; border: 3px solid var(--gold); border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>

<div class="card">
    <h2>NYX Crypt</h2>
    <textarea id="inputText" placeholder="Escribe tu mensaje..." rows="3"></textarea>
    <input type="password" id="key" placeholder="Clave secreta (mín. 8 caracteres)">
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn-cifrar" id="btnCifrar">Cifrar</button>
        <button class="btn-descifrar" id="btnDescifrar">Descifrar</button>
    </div>
    
    <div id="output"></div>
    <div id="qrcode"></div>
    
    <button class="btn-gold" onclick="downloadQR()">📥 Descargar QR</button>
    <button class="btn-gold" onclick="document.getElementById('fileInput').click()">📁 Cargar QR desde Archivo</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="scanFile(this)">
    <button class="btn-gold" onclick="startScanner()">📷 Escanear con Cámara</button>
    <div id="reader"></div>
</div>

<script>
    let qrObj = new QRCode(document.getElementById("qrcode"), { width: 256, height: 256, correctLevel: 3 });
    let isQrGenerated = false;
    const scanner = new Html5Qrcode("reader");

    document.getElementById('btnCifrar').onclick = async () => {
        const text = document.getElementById('inputText').value;
        const keyVal = document.getElementById('key').value;
        if(text && keyVal.length >= 8) {
            // Simplificado para evitar errores de carga
            qrObj.clear();
            qrObj.makeCode(text);
            isQrGenerated = true;
            document.getElementById('output').textContent = "QR Generado.";
        } else { alert("Llena los campos (Clave min 8)"); }
    };

    function downloadQR() {
        if(!isQrGenerated) return alert("Nada que descargar");
        const canvas = document.querySelector("#qrcode canvas");
        const link = document.createElement('a');
        link.download = 'nyxcrypt.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    async function startScanner() {
        document.getElementById('reader').style.display = 'block';
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            document.getElementById('inputText').value = text;
            scanner.stop();
            document.getElementById('reader').style.display = 'none';
        });
    }

    async function scanFile(input) {
        if(scanner.isScanning) await scanner.stop();
        document.getElementById('reader').style.display = 'none';
        scanner.scanFile(input.files[0], true).then(text => {
            document.getElementById('inputText').value = text;
        }).catch(() => alert("No se pudo leer el QR"));
    }
</script>
</body>
</html>
