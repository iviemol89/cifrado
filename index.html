<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NYX Crypt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  :root { --bg: #0f0f12; --panel: #1a1a20; --text: #ffffff; --accent: #2d2d3a; --gold: #d4af37; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; padding: 10px; }
  .card { background: var(--panel); padding: 20px; border-radius: 16px; width: 100%; max-width: 500px; border: 1px solid #333; }
  h2 { text-align: center; color: var(--gold); margin: 0 0 5px 0; }
  .subtitle { text-align: center; color: #888; font-size: 12px; margin-bottom: 20px; }
  label { font-size: 13px; color: #cccccc; margin-top: 15px; margin-bottom: 5px; display: block; }
  textarea, input { width: 100%; padding: 12px; border-radius: 8px; background: var(--accent); color: white; border: 1px solid #444; font-size: 16px; }
  .password-wrapper { position: relative; display: flex; align-items: center; }
  #togglePassword { position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 18px; }
  .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  #btnCifrar { background: #8b0000; color: white; }
  #btnDescifrar { background: #006400; color: white; }
  #output { background: #000; padding: 15px; margin-top: 15px; border-radius: 8px; border: 1px solid #444; font-size: 14px; word-break: break-all; min-height: 50px; color: #fff; }
  #qrcode { display: flex; justify-content: center; margin: 15px 0; background: white; padding: 10px; border-radius: 8px; }
  .extra-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .btn-gold { background: var(--gold); color: black; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  #reader { width: 100%; margin-top: 10px; display: none; border: 2px solid var(--gold); }
</style>
</head>
<body>

<div class="card">
  <h2>NYX Crypt</h2>
  <div class="subtitle">Mensajes ocultos con clave secreta</div>
  
  <label>Mensaje (o texto cifrado)</label>
  <textarea id="inputText" rows="3"></textarea>
  
  <label>Clave secreta (mínimo 8 caracteres)</label>
  <div class="password-wrapper">
    <input type="password" id="key" />
    <button type="button" id="togglePassword" onclick="toggleVisibility()">👁️</button>
  </div>
  
  <div class="button-row">
    <button id="btnCifrar">Cifrar</button>
    <button id="btnDescifrar">Descifrar</button>
  </div>

  <div id="output"></div>
  <div id="qrcode"></div>
  
  <div class="extra-buttons">
    <button class="btn-gold" onclick="downloadQR()">📥 Descargar QR</button>
    <button class="btn-gold" onclick="startScanner()">📷 Escanear con Cámara</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="scanFile(event)">
    <button class="btn-gold" onclick="document.getElementById('fileInput').click()">📁 Cargar QR desde Archivo</button>
  </div>
  <div id="reader"></div>
</div>

<script>
  function toggleVisibility() {
    const key = document.getElementById('key');
    const btn = document.getElementById('togglePassword');
    key.type = (key.type === "password") ? "text" : "password";
    btn.textContent = (key.type === "password") ? "👁️" : "🙈";
  }

  const toBase64URL = (b) => b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  const fromBase64URL = (b) => { 
    let base64 = b.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    return atob(base64);
  };

  const qr = new QRCode("qrcode", { 
    width: 256, 
    height: 256, 
    correctLevel: QRCode.CorrectLevel.H 
  });
  
  const html5QrCode = new Html5Qrcode("reader");

  async function deriveKey(password, salt) {
    const encoder = new TextEncoder();
    const baseKey = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }

  document.getElementById('btnCifrar').onclick = async () => {
    const keyVal = document.getElementById('key').value;
    if (keyVal.length < 8) { alert("La clave debe tener al menos 8 caracteres."); return; }
    try {
      const text = document.getElementById('inputText').value;
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(keyVal, salt);
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt); combined.set(iv, salt.length); combined.set(new Uint8Array(encrypted), salt.length + iv.length);
      const b64url = toBase64URL(btoa(String.fromCharCode(...combined)));
      document.getElementById('output').textContent = b64url;
      qr.makeCode(b64url);
    } catch(e) { alert("Error al cifrar"); }
  };

  document.getElementById('btnDescifrar').onclick = async () => {
    const keyVal = document.getElementById('key').value;
    if (keyVal.length < 8) { alert("La clave debe tener al menos 8 caracteres."); return; }
    try {
      const base64 = fromBase64URL(document.getElementById('inputText').value);
      const data = Uint8Array.from(base64, c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const iv = data.slice(16, 28);
      const encrypted = data.slice(28);
      const key = await deriveKey(keyVal, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, encrypted);
      document.getElementById('output').textContent = new TextDecoder().decode(decrypted);
    } catch (e) { alert("Clave incorrecta o formato inválido."); }
  };

  function downloadQR() {
    const qrcodeDiv = document.getElementById('qrcode');
    const canvas = qrcodeDiv.querySelector("canvas");
    if (canvas) {
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 512;
      finalCanvas.height = 512;
      const ctx = finalCanvas.getContext('2d');
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
      ctx.drawImage(canvas, 0, 0, 512, 512);
      const link = document.createElement('a');
      link.download = 'nyxcrypt.png';
      link.href = finalCanvas.toDataURL("image/png", 1.0);
      link.click();
    } else {
      alert("Primero debes generar un QR cifrando un mensaje.");
    }
  }

  function startScanner() {
    const reader = document.getElementById('reader');
    reader.style.display = 'block';
    html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250, aspectRatio: 1.0 }, 
      (text) => { 
        document.getElementById('inputText').value = text; 
        html5QrCode.stop().then(() => { reader.style.display = 'none'; }); 
      }).catch(err => { alert("Error de cámara: " + err); reader.style.display = 'none'; });
  }

  function scanFile(event) {
    const file = event.target.files[0];
    html5QrCode.scanFile(file, true).then(text => { 
      document.getElementById('inputText').value = text; 
    }).catch(err => alert("No se pudo leer el QR"));
  }
</script>
</body>
</html>
